name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate packaging without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm run release:check
      - run: npm pack --dry-run
      - name: Publish with npm trusted publishing
        if: ${{ !inputs.dry_run }}
        run: npm publish
